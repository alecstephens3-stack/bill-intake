[project]
name = "bill-intake"
version = "0.1.0"
description = "Vendor bill intake: model reads, rules file, a person approves, QuickBooks Online enters."
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = []

[project.optional-dependencies]
